# Same Hostinger SSH deploy pattern as maggi0207/layaKPI-Tracker.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (same values as KPI Tracker).
name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-wealthos-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/WealthOS

            git fetch --all
            git reset --hard origin/main

            docker compose \
              -f docker/docker-compose.prod.yml \
              --env-file docker/.env.production \
              up -d --build

            docker image prune -f
