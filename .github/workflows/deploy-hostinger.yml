# Matches maggi0207/layaKPI-Tracker Hostinger deploy pattern.
# Reuse VPS_* secrets (or org secrets). Host Nginx owns 80/443.
name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ~/WealthOS

            git fetch --all
            git reset --hard origin/main

            # Shared-VPS stack: frontend :3000, API :8080, Postgres internal
            docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production down
            docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production build
            docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production up -d

            docker image prune -f
