# Matches maggi0207/layaKPI-Tracker Hostinger deploy pattern.
# Reuse the same VPS_* secrets already configured for that repo (or org secrets).
name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Same VPS as layaKPI-Tracker (main domain). WealthOS lives beside it.
            cd ~/WealthOS

            # Reset local changes and pull the latest code
            git fetch --all
            git reset --hard origin/main

            # Production stack (Postgres + API + Nginx TLS reverse proxy)
            cd backend/docker
            sudo docker compose -f docker-compose.prod.yml --env-file .env down
            sudo docker compose -f docker-compose.prod.yml --env-file .env build
            sudo docker compose -f docker-compose.prod.yml --env-file .env up -d

            # Clean up old unused Docker images to save VPS storage
            sudo docker image prune -f
