# Host Nginx virtual hosts for WealthOS on a shared Hostinger VPS.
# Install:
#   sudo cp docs/nginx-hostinger.conf /etc/nginx/sites-available/wealthos
#   sudo ln -sf /etc/nginx/sites-available/wealthos /etc/nginx/sites-enabled/wealthos
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt on the host — NOT inside Docker):
#   sudo certbot --nginx -d wealthos.devenlight.com -d api.wealthos.devenlight.com
#
# Containers must already be listening on:
#   127.0.0.1:3000  → frontend
#   127.0.0.1:8080  → API

# -----------------------------------------------------------------------------
# SPA — https://wealthos.devenlight.com  →  http://127.0.0.1:3000
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name wealthos.devenlight.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wealthos.devenlight.com;

    # Managed by Certbot (paths may differ after first issuance)
    ssl_certificate     /etc/letsencrypt/live/wealthos.devenlight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wealthos.devenlight.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# -----------------------------------------------------------------------------
# API — https://api.wealthos.devenlight.com  →  http://127.0.0.1:8080
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.wealthos.devenlight.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wealthos.devenlight.com;

    ssl_certificate     /etc/letsencrypt/live/api.wealthos.devenlight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wealthos.devenlight.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Convenience alias — ASP.NET health lives at /health (unchanged)
    location = /api/health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
