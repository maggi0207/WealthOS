# WealthOS production stack — shared Hostinger VPS
# Host Nginx (ports 80/443) terminates TLS and reverse-proxies to these containers.
# Do NOT publish 80 or 443 from Docker.
#
# From repository root:
#   cp docker/.env.production.example docker/.env.production
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: wealthos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wealthos}
      POSTGRES_USER: ${POSTGRES_USER:-wealthos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - wealthos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wealthos} -d ${POSTGRES_DB:-wealthos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wealthos
    # No host ports — Postgres stays on the Docker network only.

  api:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    container_name: wealthos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-wealthos};Username=${POSTGRES_USER:-wealthos};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-https://api.wealthos.devenlight.com}
      Jwt__Audience: ${JWT_AUDIENCE:-wealthos-api}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY min 32 chars}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_DAYS:-7}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-https://wealthos.devenlight.com}
      Hangfire__WorkerCount: ${HANGFIRE_WORKER_COUNT:-2}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      AdminSeed__FirstName: ${ADMIN_SEED_FIRST_NAME:-System}
      AdminSeed__LastName: ${ADMIN_SEED_LAST_NAME:-Admin}
      AngelOne__ApiKey: ${ANGELONE_API_KEY:-}
      AngelOne__ClientCode: ${ANGELONE_CLIENT_CODE:-}
      AngelOne__Password: ${ANGELONE_PASSWORD:-}
      AngelOne__TotpSecret: ${ANGELONE_TOTP_SECRET:-}
      AngelOne__EnableLiveSync: ${ANGELONE_ENABLE_LIVE_SYNC:-false}
      AngelOne__RefreshTokenSecretName: ${ANGELONE_REFRESH_TOKEN_SECRET_NAME:-}
    ports:
      # Host 8080 is used by layaKPI on this VPS — publish WealthOS API on 8081 (loopback only).
      - "127.0.0.1:${WEALTHOS_API_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - wealthos

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: ${VITE_API_MODE:-api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.wealthos.devenlight.com}
        VITE_API_VERSION: ${VITE_API_VERSION:-1}
    container_name: wealthos-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # TanStack Start node-server listens on 3000; host Nginx proxies wealthos.* → 127.0.0.1:3000
      - "127.0.0.1:${WEALTHOS_FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - wealthos

volumes:
  wealthos_postgres_data:

networks:
  wealthos:
    driver: bridge
